<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tiktok Relative Questions - WhatsApp</title>
    <!-- Modern Font and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            /* VIP Dark Gradient Background */
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 50px 30px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            position: relative;
            margin-top: 60px; /* Space for profile picture */
        }

        /* Profile Picture Design */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f4f4f4;
            object-fit: cover;
        }

        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 700;
        }

        /* Official Verified Badge */
        .verified {
            color: #25D366;
            font-size: 18px;
        }

        .subtitle {
            font-size: 14px;
            color: #555;
            margin: 15px 0 30px;
            line-height: 1.6;
        }

        /* VIP Animated Button */
        .copy-btn {
            background: linear-gradient(to right, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px; /* Pill shape */
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
        }

        /* Pulse Animation for Copy Button */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* Button State After Copying */
        .copy-btn.copied {
            background: linear-gradient(to right, #34B7F1, #2b9ed4); /* Blue color */
            box-shadow: 0 8px 20px rgba(52, 183, 241, 0.4);
            font-size: 13.5px;
            animation: none; /* Stop pulsing when copied */
        }

        .whatsapp-icon {
            font-size: 22px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 🔴 YAHAN APNI IMAGE KA NAAM LIKHEIN 🔴 -->
        <!-- Misal ke taur par agar aap ne image ka naam 'logo.jpg' rakha hai, to niche src="logo.jpg" kar dein -->
        <img src="profile.jpg" alt="Channel Profile" class="profile-pic" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        
        <h1>Tiktok Relative Questions <i class="fas fa-check-circle verified"></i></h1>
        
        <p class="subtitle">
            Asslamulaikum! Ye naya channel banaya hai jahan main aap ke sawaalon ke jawaab donga. 
            <br><br>
            TikTok ke browser mein WhatsApp seedha open nahi hota. Niche button se link copy karein!
        </p>
        
        <button id="copyBtn" class="copy-btn pulse" onclick="copyLink()">
            <i class="fab fa-whatsapp whatsapp-icon"></i> Copy WhatsApp Link
        </button>
    </div>

    <script>
        function copyLink() {
            const linkToCopy = "https://whatsapp.com/channel/0029Vb8ttwtKWEKu6p6kGx3c";
            
            navigator.clipboard.writeText(linkToCopy).then(() => {
                const btn = document.getElementById("copyBtn");
                
                // Text aur icon update karna (Aap ki request ke mutabiq)
                btn.innerHTML = '<i class="fas fa-check-circle whatsapp-icon"></i> Link copied! Ab WhatsApp ki chat mein paste kar ke join karein';
                btn.classList.add("copied");
                btn.classList.remove("pulse");
                
            }).catch(err => {
                console.error('Copy failed: ', err);
                alert("Browser ne link copy karne ki ijazat nahi di. Please khud copy karein.");
            });
        }
    </script>

</body>
</html>
