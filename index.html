<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Junaid Jamshed - WhatsApp Channel</title>
    <!-- Modern Font and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        
        body {
            /* Clean Dark Gradient Background */
            background: linear-gradient(135deg, #111827, #1f2937, #374151); 
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.98);
            border-radius: 24px;
            padding: 50px 30px 30px;
            max-width: 400px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            position: relative;
            margin-top: 60px; /* Space for profile picture */
        }

        /* Profile Picture Design */
        .profile-pic {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #fff;
            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            background-color: #f4f4f4;
            object-fit: cover;
        }

        h1 {
            font-size: 22px;
            color: #1a1a1a;
            margin-top: 15px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 700;
        }

        .username {
            font-size: 13px;
            color: #666;
            margin-top: -2px;
            font-weight: 500;
        }

        .fan-badge {
            display: inline-block;
            background-color: #f3f4f6;
            color: #4b5563;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 12px;
            margin-top: 5px;
            font-weight: 600;
        }

        .subtitle {
            font-size: 14px;
            color: #444;
            margin: 20px 0 30px;
            line-height: 1.6;
        }

        /* VIP Animated Button */
        .copy-btn {
            background: linear-gradient(to right, #25D366, #128C7E);
            color: white;
            border: none;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .copy-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 25px rgba(37, 211, 102, 0.5);
        }

        /* Pulse Animation for Copy Button */
        .pulse {
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0.5); }
            70% { box-shadow: 0 0 0 15px rgba(37, 211, 102, 0); }
            100% { box-shadow: 0 0 0 0 rgba(37, 211, 102, 0); }
        }

        /* Button State After Copying */
        .copy-btn.copied {
            background: linear-gradient(to right, #34B7F1, #2b9ed4); 
            box-shadow: 0 8px 20px rgba(52, 183, 241, 0.4);
            font-size: 14px;
            animation: none; 
        }

        .whatsapp-icon {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- 🔴 Yahan apni TikTok wali DP (Coffee or Tea wali) ka naam likhein 🔴 -->
        <img src="profile.jpg" alt="Junaid Jamshed Profile" class="profile-pic" onerror="this.src='https://cdn-icons-png.flaticon.com/512/149/149071.png'">
        
        <h1>Junaid jamshed</h1>
        <div class="username">@junaid.jamshed520</div>
        <div class="fan-badge">Fan Page</div>
        
        <p class="subtitle">
            Asslamulaikum! Hamare WhatsApp channel mein khush amadeed. <br><br>
            TikTok ke browser mein WhatsApp seedha open nahi hota. Niche button par click kar ke link copy karein!
        </p>
        
        <button id="copyBtn" class="copy-btn pulse" onclick="copyLink()">
            <i class="fab fa-whatsapp whatsapp-icon"></i> Copy WhatsApp Link
        </button>
    </div>

    <script>
        function copyLink() {
            const linkToCopy = "https://whatsapp.com/channel/0029Vb8ttwtKWEKu6p6kGx3c";
            
            navigator.clipboard.writeText(linkToCopy).then(() => {
                const btn = document.getElementById("copyBtn");
                
                // Button Text Update
                btn.innerHTML = '<i class="fas fa-check-circle whatsapp-icon"></i> Link copied! Ab WhatsApp ki chat mein paste kar ke join karein';
                btn.classList.add("copied");
                btn.classList.remove("pulse");
                
            }).catch(err => {
                console.error('Copy failed: ', err);
                alert("Browser ne link copy karne ki ijazat nahi di. Please khud copy karein.");
            });
        }
    </script>

</body>
</html>
