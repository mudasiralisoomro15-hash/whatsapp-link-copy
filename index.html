<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Junaid Jamshed | WhatsApp Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-deep:#0b3d2e;
    --emerald-dark:#082a20;
    --gold:#d4af37;
    --gold-soft:#e9cd7a;
    --cream:#f6efdd;
    --ink:#0f1d16;
    --sage:#7fa88f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--emerald-dark);font-family:'Poppins',sans-serif;color:var(--cream);overflow-x:hidden;}
  body{
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:28px 18px;position:relative;
    background:
      radial-gradient(circle at 20% 15%, rgba(212,175,55,0.10), transparent 40%),
      radial-gradient(circle at 85% 85%, rgba(212,175,55,0.08), transparent 45%),
      linear-gradient(160deg, var(--emerald-dark) 0%, var(--emerald-deep) 55%, #052018 100%);
  }
  .lattice{position:fixed;inset:0;opacity:0.06;background-image:repeating-linear-gradient(45deg, var(--gold) 0 1px, transparent 1px 34px),repeating-linear-gradient(-45deg, var(--gold) 0 1px, transparent 1px 34px);pointer-events:none;}
  .card{
    position:relative;width:100%;max-width:400px;
    background:linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.01));
    border:1px solid rgba(212,175,55,0.35);border-radius:22px;padding:38px 26px 34px;text-align:center;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.6), 0 0 0 1px rgba(212,175,55,0.06) inset;
    backdrop-filter:blur(6px);animation:rise 0.7s cubic-bezier(.2,.8,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(18px);}to{opacity:1;transform:translateY(0);}}
  .card::before,.card::after{content:"";position:absolute;width:26px;height:26px;border:1.5px solid var(--gold);opacity:0.55;}
  .card::before{top:10px;left:10px;border-right:none;border-bottom:none;border-top-left-radius:10px;}
  .card::after{bottom:10px;right:10px;border-left:none;border-top:none;border-bottom-right-radius:10px;}
  .vip-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 16px;border:1px solid var(--gold);border-radius:999px;font-size:11px;letter-spacing:3px;color:var(--gold-soft);background:rgba(212,175,55,0.08);margin-bottom:22px;text-transform:uppercase;}
  .avatar-ring{width:96px;height:96px;margin:0 auto 18px;border-radius:50%;padding:3px;background:conic-gradient(from 180deg, var(--gold), var(--gold-soft), var(--gold));display:flex;align-items:center;justify-content:center;}
  .avatar-ring .inner{width:100%;height:100%;border-radius:50%;background:var(--emerald-deep);display:flex;align-items:center;justify-content:center;font-family:'Amiri',serif;font-size:34px;color:var(--gold-soft);overflow:hidden;}
  .avatar-ring .inner img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
  h1{font-family:'Amiri',serif;font-weight:700;font-size:26px;color:var(--cream);letter-spacing:0.5px;margin-bottom:4px;}
  .subtitle{font-size:13px;color:var(--sage);letter-spacing:1px;margin-bottom:22px;}
  .divider{width:60px;height:1px;margin:0 auto 22px;background:linear-gradient(90deg, transparent, var(--gold), transparent);}
  .desc{font-size:14px;line-height:1.9;color:#d8e3dc;margin-bottom:28px;padding:0 4px;white-space:pre-line;}
  .link-box{display:flex;align-items:center;gap:10px;background:rgba(0,0,0,0.25);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:12px 14px;margin-bottom:16px;}
  .link-box span{flex:1;text-align:left;font-size:12px;color:#bcd0c6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;direction:ltr;}
  .btn-copy{width:100%;padding:15px;border:none;border-radius:12px;background:linear-gradient(135deg, var(--gold-soft), var(--gold));color:var(--emerald-dark);font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:0.5px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:transform 0.15s ease;box-shadow:0 10px 25px -8px rgba(212,175,55,0.5);}
  .btn-copy:active{transform:scale(0.97);}
  .btn-copy.copied{background:linear-gradient(135deg, #8fd6ac, #5cb885);color:var(--emerald-dark);}
  .btn-copy svg{width:18px;height:18px;flex-shrink:0;}
  .btn-open{display:block;margin-top:12px;font-size:13px;color:var(--sage);text-decoration:underline;text-underline-offset:3px;}
  .loading-dim{opacity:0.4;filter:blur(1px);transition:opacity 0.3s ease, filter 0.3s ease;}
</style>
</head>
<body>

<div class="lattice"></div>

<div class="card" id="card">
  <div class="vip-badge">✦ VIP Channel ✦</div>

  <div class="avatar-ring"><div class="inner" id="avatarInner">JJ</div></div>

  <h1 id="nameText">Junaid Jamshed</h1>
  <div class="subtitle" id="subtitleText">Official Fan WhatsApp Channel</div>

  <div class="divider"></div>

  <p class="desc" id="aboutText">Loading...</p>

  <div class="link-box">
    <span id="linkText">whatsapp.com/channel/...</span>
  </div>

  <button class="btn-copy" id="copyBtn" onclick="copyLink()">
    <svg id="copyIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="9" y="9" width="12" height="12" rx="2"></rect>
      <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
    </svg>
    <span id="btnLabel">Link Copy Karein</span>
  </button>

  <a class="btn-open" id="openLink" href="#" target="_blank" rel="noopener">
    Ya seedha yahan tap karein
  </a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWvG8HNIZu_SGzdGLRS48GJgjUnRxtYg8",
    authDomain: "automatic-automation.firebaseapp.com",
    projectId: "automatic-automation",
    storageBucket: "automatic-automation.firebasestorage.app",
    messagingSenderId: "681446815023",
    appId: "1:681446815023:web:b7a9111a6a13dee7e59dda",
    measurementId: "G-EFEKPW5VY7"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  let currentLink = "";

  const configRef = doc(db, "site", "config");

  onSnapshot(configRef, (snap) => {
    if(!snap.exists()) return;
    const data = snap.data();

    document.getElementById('nameText').textContent = data.name || "Junaid Jamshed";
    document.getElementById('subtitleText').textContent = data.subtitle || "Official Fan WhatsApp Channel";
    document.getElementById('aboutText').textContent = data.about || "";

    const link = data.whatsappLink || "";
    currentLink = link;
    document.getElementById('linkText').textContent = link.replace(/^https?:\/\//,'');
    document.getElementById('openLink').href = link;

    const avatarInner = document.getElementById('avatarInner');
    if(data.avatarUrl){
      avatarInner.innerHTML = `<img src="${data.avatarUrl}" alt="profile">`;
    } else {
      avatarInner.textContent = data.initials || "JJ";
    }
  }, (err) => {
    console.error("Firestore read error:", err);
    document.getElementById('aboutText').textContent = "Content load nahi ho saka.";
  });

  window.copyLink = function(){
    const btn = document.getElementById('copyBtn');
    const label = document.getElementById('btnLabel');
    const link = currentLink;

    function showCopied(){
      btn.classList.add('copied');
      label.textContent = "Copy Ho Gaya! ✓";
      setTimeout(() => {
        btn.classList.remove('copied');
        label.textContent = "Link Copy Karein";
      }, 2000);
    }

    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(link).then(showCopied).catch(fallbackCopy);
    } else {
      fallbackCopy();
    }

    function fallbackCopy(){
      const ta = document.createElement('textarea');
      ta.value = link;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      try{
        document.execCommand('copy');
        showCopied();
      }catch(e){
        label.textContent = "Copy nahi hua, manually select karein";
      }
      document.body.removeChild(ta);
    }
  };
</script>

</body>
</html>
