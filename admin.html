<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Admin Panel</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --emerald-deep:#0b3d2e; --emerald-dark:#082a20; --gold:#d4af37; --gold-soft:#e9cd7a;
    --cream:#f6efdd; --sage:#7fa88f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--emerald-dark);font-family:'Poppins',sans-serif;color:var(--cream);}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;}
  .panel{width:100%;max-width:420px;background:linear-gradient(180deg, rgba(255,255,255,0.04), rgba(255,255,255,0.01));border:1px solid rgba(212,175,55,0.3);border-radius:18px;padding:30px 24px;}
  h1{font-family:'Amiri',serif;font-size:22px;margin-bottom:6px;color:var(--gold-soft);}
  .sub{font-size:12px;color:var(--sage);margin-bottom:24px;}
  label{display:block;font-size:12px;color:var(--sage);margin:16px 0 6px;letter-spacing:0.5px;}
  input[type=text], input[type=email], input[type=password], input[type=url], textarea{
    width:100%;padding:11px 13px;background:rgba(0,0,0,0.25);border:1px solid rgba(212,175,55,0.3);border-radius:10px;
    color:var(--cream);font-family:'Poppins',sans-serif;font-size:14px;outline:none;
  }
  textarea{resize:vertical;min-height:80px;line-height:1.6;}
  input:focus, textarea:focus{border-color:var(--gold);}
  button{width:100%;margin-top:20px;padding:13px;border:none;border-radius:10px;background:linear-gradient(135deg, var(--gold-soft), var(--gold));color:var(--emerald-dark);font-weight:600;font-size:14px;cursor:pointer;}
  button:active{transform:scale(0.98);}
  button.secondary{background:transparent;border:1px solid rgba(212,175,55,0.4);color:var(--gold-soft);}
  .status{margin-top:14px;font-size:13px;text-align:center;min-height:18px;}
  .status.ok{color:#8fd6ac;}
  .status.err{color:#e08787;}
  .hidden{display:none;}
  .avatar-preview{width:64px;height:64px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);margin-top:10px;display:none;}
  .file-row{display:flex;gap:10px;align-items:center;margin-top:8px;}
  small.hint{display:block;margin-top:4px;font-size:11px;color:rgba(216,227,220,0.5);}

  .stats-divider{height:1px;background:rgba(212,175,55,0.25);margin:26px 0 18px;}
  .section-title{font-family:'Amiri',serif;font-size:18px;color:var(--gold-soft);margin-bottom:14px;}
  .stat-cards{display:flex;gap:10px;margin-bottom:14px;}
  .stat-card{flex:1;background:rgba(212,175,55,0.08);border:1px solid rgba(212,175,55,0.3);border-radius:12px;padding:14px;text-align:center;}
  .stat-num{font-size:24px;font-weight:600;color:var(--gold-soft);}
  .stat-label{font-size:11px;color:var(--sage);margin-top:2px;}
  .visitor-list{margin-top:14px;max-height:320px;overflow-y:auto;border:1px solid rgba(212,175,55,0.2);border-radius:10px;}
  .visitor-row{padding:10px 12px;border-bottom:1px solid rgba(212,175,55,0.12);font-size:12px;display:flex;gap:10px;align-items:flex-start;}
  .visitor-row:last-child{border-bottom:none;}
  .visitor-row input[type=checkbox]{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex-shrink:0;}
  .visitor-row .vbody{flex:1;}
  .visitor-row .vtop{display:flex;justify-content:space-between;color:var(--cream);}
  .visitor-row .vip{font-family:monospace;color:var(--gold-soft);}
  .visitor-row .vtime{color:var(--sage);}
  .visitor-row .vsrc{margin-top:3px;font-size:11px;color:var(--sage);}
  .badge-tiktok{display:inline-block;background:rgba(212,175,55,0.2);color:var(--gold-soft);padding:1px 7px;border-radius:6px;font-size:10px;margin-left:4px;}
  .time-badge{display:inline-block;margin-top:6px;background:rgba(224,135,135,0.15);border:1px solid rgba(224,135,135,0.45);color:#e08787;padding:4px 10px;border-radius:8px;font-size:12px;font-weight:600;}
</style>
</head>
<body>

<div class="panel">
  <h1>Admin Panel</h1>
  <div class="sub">Hidden — sirf aapke paas ye link hai</div>

  <!-- LOGIN -->
  <div id="loginBox">
    <label>Email</label>
    <input type="email" id="loginEmail" autocomplete="username">
    <label>Password</label>
    <input type="password" id="loginPass" autocomplete="current-password">
    <button onclick="login()">Login</button>
    <div class="status" id="loginStatus"></div>
  </div>

  <!-- EDIT FORM -->
  <div id="editBox" class="hidden">
    <label>Name</label>
    <input type="text" id="fName" placeholder="Junaid Jamshed">

    <label>Subtitle</label>
    <input type="text" id="fSubtitle" placeholder="Official Fan WhatsApp Channel">

    <label>Trust Line (VIP Verified Page ke saath dikhta hai)</label>
    <input type="text" id="fTrustText" placeholder="Trusted by 3,000+ followers">

    <label>About / Description Text</label>
    <textarea id="fAbout" placeholder="Maine naya WhatsApp channel banaya hai..."></textarea>

    <label>WhatsApp Channel Link</label>
    <input type="url" id="fLink" placeholder="https://whatsapp.com/channel/...">

    <label>Profile Picture</label>
    <input type="url" id="fAvatarUrl" placeholder="Image URL (ya neeche se upload karein)">
    <div class="file-row">
      <input type="file" id="fAvatarFile" accept="image/*" style="flex:1;">
    </div>
    <img id="avatarPreview" class="avatar-preview">
    <small class="hint">File choose karne par automatically upload hoke URL fill ho jayega.</small>

    <button onclick="saveConfig()">Save Changes</button>
    <button class="secondary" onclick="logout()">Logout</button>
    <div class="status" id="saveStatus"></div>
  </div>

  <!-- VISITOR STATS -->
  <div id="statsBox" class="hidden">
    <div class="stats-divider"></div>
    <h2 class="section-title">Visitors</h2>

    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-num" id="totalVisits">–</div>
        <div class="stat-label">Total Visits</div>
      </div>
      <div class="stat-card" id="repeatCard" onclick="toggleRepeatVisitors()" style="cursor:pointer;">
        <div class="stat-num" id="repeatVisits">–</div>
        <div class="stat-label">Dobara Aane Wale</div>
      </div>
    </div>
    <div class="stat-cards">
      <div class="stat-card">
        <div class="stat-num" id="copiedVisits">–</div>
        <div class="stat-label">Link Copy Kiya</div>
      </div>
      <div class="stat-card">
        <div class="stat-num" id="bouncedVisits">–</div>
        <div class="stat-label">Bina Kuch Kiye Gaye</div>
      </div>
    </div>

    <button class="secondary" onclick="loadVisitors()">Refresh</button>
    <button class="secondary" id="deleteSelectedBtn" onclick="deleteSelectedVisitors()" style="margin-top:8px;border-color:#e08787;color:#e08787;">Selected Delete Karein</button>

    <div id="repeatVisitorList" class="visitor-list hidden" style="margin-top:14px;"></div>

    <div id="visitorList" class="visitor-list"></div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
  import { getFirestore, doc, getDoc, setDoc, deleteDoc, collection, query, orderBy, limit, getDocs, getCountFromServer, where } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";
  import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-storage.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBWvG8HNIZu_SGzdGLRS48GJgjUnRxtYg8",
    authDomain: "automatic-automation.firebaseapp.com",
    projectId: "automatic-automation",
    storageBucket: "automatic-automation.firebasestorage.app",
    messagingSenderId: "681446815023",
    appId: "1:681446815023:web:b7a9111a6a13dee7e59dda",
    measurementId: "G-EFEKPW5VY7"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);
  const storage = getStorage(app);
  const configRef = doc(db, "site", "config");

  const loginBox = document.getElementById('loginBox');
  const editBox = document.getElementById('editBox');
  const statsBox = document.getElementById('statsBox');

  onAuthStateChanged(auth, async (user) => {
    if(user){
      loginBox.classList.add('hidden');
      editBox.classList.remove('hidden');
      statsBox.classList.remove('hidden');
      await loadConfig();
      await loadVisitors();
    } else {
      loginBox.classList.remove('hidden');
      editBox.classList.add('hidden');
      statsBox.classList.add('hidden');
    }
  });

  window.login = async function(){
    const email = document.getElementById('loginEmail').value.trim();
    const pass = document.getElementById('loginPass').value;
    const status = document.getElementById('loginStatus');
    status.className = 'status';
    status.textContent = 'Signing in...';
    try{
      await signInWithEmailAndPassword(auth, email, pass);
      status.textContent = '';
    }catch(e){
      status.className = 'status err';
      status.textContent = 'Login fail: ' + e.message;
    }
  };

  window.logout = function(){
    signOut(auth);
  };

  async function loadConfig(){
    const snap = await getDoc(configRef);
    if(snap.exists()){
      const d = snap.data();
      document.getElementById('fName').value = d.name || '';
      document.getElementById('fSubtitle').value = d.subtitle || '';
      document.getElementById('fTrustText').value = d.trustText || '';
      document.getElementById('fAbout').value = d.about || '';
      document.getElementById('fLink').value = d.whatsappLink || '';
      document.getElementById('fAvatarUrl').value = d.avatarUrl || '';
      if(d.avatarUrl){
        const preview = document.getElementById('avatarPreview');
        preview.src = d.avatarUrl;
        preview.style.display = 'block';
      }
    }
  }

  document.getElementById('fAvatarFile').addEventListener('change', async (e) => {
    const file = e.target.files[0];
    if(!file) return;
    const status = document.getElementById('saveStatus');
    status.className = 'status';
    status.textContent = 'Uploading image...';
    try{
      const fileRef = ref(storage, 'profile/avatar_' + Date.now());
      await uploadBytes(fileRef, file);
      const url = await getDownloadURL(fileRef);
      document.getElementById('fAvatarUrl').value = url;
      const preview = document.getElementById('avatarPreview');
      preview.src = url;
      preview.style.display = 'block';
      status.className = 'status ok';
      status.textContent = 'Image upload ho gayi. Ab Save Changes dabayein.';
    }catch(e){
      status.className = 'status err';
      status.textContent = 'Upload fail: ' + e.message;
    }
  });

  window.saveConfig = async function(){
    const status = document.getElementById('saveStatus');
    status.className = 'status';
    status.textContent = 'Saving...';
    try{
      await setDoc(configRef, {
        name: document.getElementById('fName').value.trim(),
        subtitle: document.getElementById('fSubtitle').value.trim(),
        trustText: document.getElementById('fTrustText').value.trim(),
        about: document.getElementById('fAbout').value.trim(),
        whatsappLink: document.getElementById('fLink').value.trim(),
        avatarUrl: document.getElementById('fAvatarUrl').value.trim(),
        updatedAt: new Date().toISOString()
      }, { merge: true });
      status.className = 'status ok';
      status.textContent = 'Save ho gaya ✓ — page par turant update ho jayega.';
    }catch(e){
      status.className = 'status err';
      status.textContent = 'Save fail: ' + e.message;
    }
  };

  window.deleteSelectedVisitors = async function(){
    const checked = document.querySelectorAll('.visitor-check:checked');
    if(checked.length === 0){
      alert('Pehle koi visitor select karein.');
      return;
    }
    if(!confirm(`${checked.length} visitor record delete karein?`)) return;

    const btn = document.getElementById('deleteSelectedBtn');
    btn.textContent = 'Deleting...';
    try{
      for(const cb of checked){
        await deleteDoc(doc(db, "visits", cb.dataset.id));
      }
      btn.textContent = 'Selected Delete Karein';
      await loadVisitors();
    }catch(e){
      btn.textContent = 'Selected Delete Karein';
      alert('Delete fail: ' + e.message);
    }
  };

  window.toggleRepeatVisitors = async function(){
    const box = document.getElementById('repeatVisitorList');
    if(!box.classList.contains('hidden')){
      box.classList.add('hidden');
      return;
    }
    box.classList.remove('hidden');
    box.innerHTML = '<div class="visitor-row">Loading...</div>';
    try{
      const uniqueRef = collection(db, "uniqueVisitors");
      const q = query(uniqueRef, where("visitCount", ">", 1), orderBy("visitCount", "desc"), limit(30));
      const snap = await getDocs(q);

      if(snap.empty){
        box.innerHTML = '<div class="visitor-row">Abhi tak koi banda dobara nahi aaya.</div>';
        return;
      }

      box.innerHTML = '';
      snap.forEach(docSnap => {
        const d = docSnap.data();
        const times = (d.timestamps || []).map(ts => new Date(ts).toLocaleString());
        let timesHtml = times.map((t, i) => {
          const label = i === 0 ? 'Pehli baar link par click kiya' : '🔁 Phir se link par click kiya';
          return `<div class="vsrc">${label} — ${t}</div>`;
        }).join('');

        const row = document.createElement('div');
        row.className = 'visitor-row';
        row.innerHTML = `
          <div class="vbody">
            <div class="vtop"><span class="vip">${d.lastIp || d.ip || 'unknown'}</span><span class="vtime">${d.visitCount}x aaya</span></div>
            ${timesHtml}
          </div>
        `;
        box.appendChild(row);
      });
    }catch(e){
      box.innerHTML = '<div class="visitor-row">Load nahi ho saka: ' + e.message + '</div>';
    }
  };

  window.loadVisitors = async function(){
    const listEl = document.getElementById('visitorList');
    listEl.innerHTML = '<div class="visitor-row">Loading...</div>';
    try{
      const visitsRef = collection(db, "visits");
      const uniqueRef = collection(db, "uniqueVisitors");

      const [totalSnap, repeatSnap, copiedSnap, bouncedSnap, recentSnap] = await Promise.all([
        getCountFromServer(query(uniqueRef)),
        getCountFromServer(query(uniqueRef, where("visitCount", ">", 1))),
        getCountFromServer(query(visitsRef, where("action", "in", ["copied","opened_direct"]))),
        getCountFromServer(query(visitsRef, where("action", "==", "bounced"))),
        getDocs(query(visitsRef, orderBy("timestamp", "desc"), limit(30)))
      ]);

      document.getElementById('totalVisits').textContent = totalSnap.data().count;
      document.getElementById('repeatVisits').textContent = repeatSnap.data().count;
      document.getElementById('copiedVisits').textContent = copiedSnap.data().count;
      document.getElementById('bouncedVisits').textContent = bouncedSnap.data().count;

      if(recentSnap.empty){
        listEl.innerHTML = '<div class="visitor-row">Abhi koi visit record nahi hui.</div>';
        return;
      }

      listEl.innerHTML = '';
      recentSnap.forEach(docSnap => {
        const v = docSnap.data();
        const t = v.timestamp && v.timestamp.toDate ? v.timestamp.toDate().toLocaleString() : '—';
        const src = v.fromTikTok ? 'TikTok se aaya' : (v.referrer && v.referrer !== 'direct' ? v.referrer : 'Direct link');
        const actionLabel = v.action === 'copied' ? '✓ Link Copy Kiya' : v.action === 'opened_direct' ? '✓ Direct Open Kiya' : v.action === 'bounced' ? '✗ Kuch nahi kiya' : '… abhi page par hai';
        const timeSpent = v.timeOnPageSec ? `${v.timeOnPageSec} sec ruka` : (v.action === 'none' ? 'time update hone ka intezar...' : '');
        const row = document.createElement('div');
        row.className = 'visitor-row';
        row.innerHTML = `
          <input type="checkbox" class="visitor-check" data-id="${docSnap.id}">
          <div class="vbody">
            <div class="vtop"><span class="vip">${v.ip || 'unknown'}</span><span class="vtime">${t}</span></div>
            <div class="vsrc">${src}${v.fromTikTok ? '<span class="badge-tiktok">TikTok</span>' : ''}</div>
            <div class="vsrc">${actionLabel}</div>
            <div class="time-badge">⏱ ${timeSpent}</div>
          </div>
        `;
        listEl.appendChild(row);
      });
    }catch(e){
      listEl.innerHTML = '<div class="visitor-row">Load nahi ho saka: ' + e.message + '</div>';
    }
  };
</script>

</body>
</html>
